name: Vectta validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --test tests/knowledge-client.mjs tests/problem-solutions.mjs tests/knowledge.mjs tests/home-clock.mjs tests/client-operating.mjs tests/whatsapp-test.mjs tests/customer-success.mjs tests/pending-strategy.mjs tests/implantation-journey.mjs tests/workspace.mjs tests/post-meeting.mjs tests/goals.mjs tests/session-refresh.mjs
      - run: node tests/auth-session.mjs
      - run: pnpm build



